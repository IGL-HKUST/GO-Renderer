[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "go-renderer"
version = "0.1.0"
description = "Geometry-guided object rendering for controllable video generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Zekai Gu" },
  { name = "Bo Dai" },
  { name = "Yanwei Fu" },
  { name = "Gordon Wetzstein" },
  { name = "Ping Tan" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate>=1.2.0,<2.0.0",
  "albumentations>=1.4.0,<3.0.0",
  "decord>=0.6.0",
  "deepspeed>=0.17.0,<0.18.0",
  "diffusers>=0.35.1,<0.36.0",
  "einops>=0.7.0",
  "func-timeout>=4.3.5",
  "huggingface-hub>=0.27.0,<1.0.0",
  "imageio[ffmpeg]>=2.34.0",
  "numpy>=1.26.0,<3.0.0",
  "omegaconf>=2.3.0",
  "opencv-python-headless>=4.9.0",
  "packaging>=23.2",
  "pillow>=10.0.0",
  "safetensors>=0.4.3",
  "sentencepiece>=0.2.0",
  "tensorboard>=2.16.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "tqdm>=4.66.0",
  "transformers>=4.49.0,<5.0.0",
]

[project.optional-dependencies]
attention = ["flash-attn>=2.7.0"]
tracking = ["wandb>=0.17.0"]
test = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://igl-hkust.github.io/GO-Renderer/"
Paper = "https://arxiv.org/abs/2603.23246"

[tool.setuptools.packages.find]
include = ["go_renderer*"]
